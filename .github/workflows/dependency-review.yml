name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          # golang.org/x/* ship a PATENTS grant that scancode reports as
          # "BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang".
          # The patent grant is permissive (in our favour); exempt these trusted
          # Go-team packages from the license check rather than allowing an opaque
          # LicenseRef globally.
          allow-dependencies-licenses: pkg:golang/golang.org/x/sys, pkg:golang/golang.org/x/time
