name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 1'  # every Monday 01:30 UTC
  workflow_dispatch:

# Least privilege: read-only at the workflow level; the scorecard job gets the
# write scopes it needs (upload SARIF, OIDC).
permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    if: ${{ vars.SCORECARD_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
          # SCORECARD_TOKEN (PAT) only improves the Branch-Protection check;
          # all other checks work with the default token on public repos.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v3 (2026-03-06)
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
