name: security-and-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: '1.26'
          check-latest: true  # use the newest 1.26 patch, not the runner's cached one
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.24.7 -quiet ./...

      - name: Unit tests (race detector)
        run: go test -race -cover ./...
