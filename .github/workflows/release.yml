name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  # Security gate: every release runs the full security check suite AND is
  # blocked while any issue labeled `security` is still open. The build jobs
  # only start once this gate passes.
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.24.7 -quiet ./...

      - name: Unit tests (race detector)
        run: go test -race -cover ./...

      - name: CBOM is consistent with the source
        run: bash scripts/check-cbom.sh

      - name: Block release on non-NIST cryptography (CBOM policy)
        run: |
          # Hard gate: deny rules in policy/nist-crypto.rego fail the build if any
          # cryptographic asset in docs/cbom.cdx.json is not NIST-approved (weak
          # algorithm, or TLS < 1.2). Quantum-readiness findings are warn-only.
          go run github.com/open-policy-agent/conftest@v0.68.2 \
            test docs/cbom.cdx.json --policy policy

      - name: Block release on open security findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label security --state open --json number,title --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "::error::Release blocked — $OPEN open security issue(s):"
            gh issue list --repo "$GITHUB_REPOSITORY" --label security --state open
            exit 1
          fi
          echo "No open security issues — release approved."

  build:
    name: Build ${{ matrix.artifact }}
    needs: security-gate
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: confluence-backup-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: confluence-backup-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: confluence-backup-windows-amd64.exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build \
            -mod=vendor \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ${{ matrix.artifact }} \
            ./cmd/backup/

      - name: Attest SLSA provenance (Level 2)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true
          path: dist/

      - name: Generate SHA256 checksums
        run: |
          cd dist/
          sha256sum confluence-backup-linux-amd64 confluence-backup-linux-arm64 confluence-backup-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Sign binaries with cosign (keyless / OIDC)
        run: |
          for binary in \
            dist/confluence-backup-linux-amd64 \
            dist/confluence-backup-linux-arm64 \
            dist/confluence-backup-windows-amd64.exe; do
            cosign sign-blob \
              --yes \
              --bundle "${binary}.bundle" \
              "${binary}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            --title "confluence-backup ${{ github.ref_name }}" \
            dist/confluence-backup-linux-amd64 \
            dist/confluence-backup-linux-arm64 \
            dist/confluence-backup-windows-amd64.exe \
            dist/confluence-backup-linux-amd64.bundle \
            dist/confluence-backup-linux-arm64.bundle \
            dist/confluence-backup-windows-amd64.exe.bundle \
            dist/SHA256SUMS
